name: Protocol tests

'on':
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  forge-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.7.1
      - run: npm ci --prefix vendor/kleros-v2 --ignore-scripts --no-audit --no-fund
      - run: forge test
