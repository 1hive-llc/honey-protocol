[profile.default]
src = "src"
out = "out"
libs = ["lib", "vendor/kleros-v2/node_modules"]
solc = "0.8.30"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 1
bytecode_hash = "none"
revert_strings = "strip"
fs_permissions = [{ access = "read", path = "./test/fixtures/agreement/artifacts" }]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
